# Declarative WezTerm color scheme; no shell or keybinding overrides.
[metadata]
name = "Tokencat"

[colors]
foreground = "#f2f4f8"
background = "#161616"
cursor_bg = "#f2f4f8"
cursor_fg = "#161616"
cursor_border = "#f2f4f8"
selection_fg = "#f2f4f8"
selection_bg = "#2a2a2a"
scrollbar_thumb = "#525253"
split = "#525253"
ansi = ["#282828", "#ee5396", "#25be6a", "#08bdba", "#78a9ff", "#be95ff", "#33b1ff", "#dfdfe0"]
brights = ["#484848", "#f16da6", "#46c880", "#2dc7c4", "#8cb6ff", "#c8a5ff", "#52bdff", "#e4e4e5"]

[colors.tab_bar]
background = "#0d0d0d"

[colors.tab_bar.active_tab]
bg_color = "#78a9ff"
fg_color = "#161616"

[colors.tab_bar.inactive_tab]
bg_color = "#0d0d0d"
fg_color = "#97999b"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#282828"
fg_color = "#f2f4f8"

[colors.tab_bar.new_tab]
bg_color = "#0d0d0d"
fg_color = "#dfdfe0"

[colors.tab_bar.new_tab_hover]
bg_color = "#2a2a2a"
fg_color = "#f2f4f8"
