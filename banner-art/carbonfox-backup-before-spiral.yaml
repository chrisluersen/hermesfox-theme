  [#33b1ff]  `.              [/][#7f8489],  \ \ /  |[/]
  [#33b1ff]   /`.          ,'[/][#7f8489]-`----Y   |[/]
  [#33b1ff]  (            ;  [/][#7f8489]      |   '[/]
  [#33b1ff]  |  ,-.    ,-'   [/][#7f8489]      |  /[/]
