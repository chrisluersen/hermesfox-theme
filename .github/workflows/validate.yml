name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check scripts tests
      - name: Check Python formatting
        run: python -m ruff format --check scripts tests
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate theme payload
        run: python -B scripts/validate_theme.py
      - name: Validate shell syntax
        run: bash -n fonts/install-hack-nerd-font.sh
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck fonts/install-hack-nerd-font.sh
      - name: Check whitespace
        run: |
          git diff --check
          git show --check --oneline HEAD
