name: carbonfox
description: "Eden carbonfox — matches WezTerm + zellij + nvim carbonfox. Palette from EdenEast/nightfox.nvim lua/nightfox/palette/carbonfox.lua."

# Carbonfox palette (EdenEast/nightfox carbonfox.lua):
#   bg #161616  bg0 #0d0d0d  sel0 #2a2a2a  sel1 #525253  fg #f2f4f8  fg2 #dfdfe0
#   comment #7f8489  blue #78a9ff  cyan #33b1ff  teal #3ddbd9  green #25be6a
#   purple #be95ff  red #ee5396   (+ #ff9e64 warm warn: carbonfox has no orange)
#
# Colour roles (one job per hue, so blue stops meaning everything):
#   blue   = Hermes chrome: panel frame, section headers, response frame, session
#   cyan   = labels/keys          teal = tool calls (the cat's feet colour)
#   purple = reasoning, dimmed 70% toward bg so it never outshines the answer
#   gray   = passive chrome: input rule, borders, separators
# Surfaces follow nvim: status line on bg0, popup on sel0, popup selection sel1.
# Syntax + diff follow nightfox's spec (string green, keyword magenta, number
# "orange"=teal; diff rows are 15% hue blends over bg), so code in Hermes looks
# like code in nvim.
colors:
  background: "#161616"              # App/base surface (bg1)
  banner_border: "#78a9ff"           # Panel/overlay frame (blue)
  banner_title: "#f2f4f8"            # Titles (fg)
  banner_accent: "#78a9ff"           # Section headers (blue)
  banner_dim: "#7f8489"              # Muted text (comment)
  banner_text: "#f2f4f8"             # Body text (fg)
  ui_accent: "#78a9ff"               # General accent (blue)
  ui_label: "#33b1ff"                # Labels/keys (cyan)
  ui_ok: "#25be6a"                   # Success (green)
  ui_error: "#ee5396"                # Error (red)
  ui_warn: "#ff9e64"                 # Warning (warm orange)
  ui_tool: "#3ddbd9"                 # Tool-call markers (teal, distinct from blue/cyan)
  ui_thinking: "#8c6fb9"             # Reasoning text (purple 70% over bg, 4.4:1)
  shell_dollar: "#25be6a"            # `$` shell marker (else inherits default skin)
  diff_added: "#182f23"              # Diff added-row bg (green 15% over bg)
  diff_removed: "#361f29"            # Diff removed-row bg (red 15% over bg)
  diff_added_word: "#25be6a"         # Diff added word fg (green)
  diff_removed_word: "#ee5396"       # Diff removed word fg (red)
  syntax_string: "#25be6a"           # Strings (nightfox: green)
  syntax_number: "#3ddbd9"           # Numbers (nightfox: orange.base = teal)
  syntax_keyword: "#be95ff"          # Keywords (nightfox: magenta)
  syntax_comment: "#7f8489"          # Comments (comment)
  prompt: "#78a9ff"                  # Prompt symbol (blue; typed text keeps terminal fg)
  input_rule: "#525253"              # Input rule (sel1 gray - passive chrome)
  response_border: "#78a9ff"         # Response frame (blue)
  status_bar_bg: "#0d0d0d"           # Status bar (bg0, like nvim statusline)
  status_bar_text: "#dfdfe0"         # Status text (fg2)
  status_bar_strong: "#f2f4f8"       # Status highlight (fg)
  status_bar_dim: "#7f8489"          # Status separators (comment)
  status_bar_good: "#25be6a"         # Context OK (green)
  status_bar_warn: "#ff9e64"         # Context warning (orange)
  status_bar_bad: "#ee5396"          # Context high (red)
  status_bar_critical: "#ff5f5f"     # Context critical (hot red)
  session_label: "#78a9ff"           # Session label (blue)
  session_border: "#7f8489"          # Session ID (comment)
  voice_status_bg: "#0d0d0d"         # Voice status (matches status bar)
  selection_bg: "#2a2a2a"            # Mouse selection (sel0, like nvim Visual)
  completion_menu_bg: "#2a2a2a"      # Popup (sel0, like nvim Pmenu)
  completion_menu_current_bg: "#525253"   # Popup selection (sel1, like PmenuSel)
  completion_menu_meta_bg: "#2a2a2a"      # Popup meta column
  completion_menu_meta_current_bg: "#525253"  # Popup meta selection

# Branding — keep agent identity, tune nothing for theme.
branding:
  agent_name: "Hermes Agent"

# Intentionally blank: a single space suppresses the built-in HERMES AGENT
# fallback while keeping the Hermesfox logo artwork archived, not embedded.
banner_logo: " "

# banner_hero is a TOP-LEVEL skin key (skin_engine.py:857 reads data["banner_hero"],
# NOT branding.banner_hero). Replaces HERMES_CADUCEUS in CLI + TUI.
# Hero art: "token-cat" (Hayley Jane Wakenshaw / Flump, asciiart.eu 8c5113000921d06a,
# 29x11, artist initials removed). REGION MAP IS OWNER-WORDED - do NOT re-derive it
# from the glyphs (two wrong guesses and two contradictory vision reads on 2026-09-20):
#   "the very bottom straight line is still the box, the cat is also the triangle at
#    the end of the curve as well as the other marks following the curve above the
#    square"
# So: the BOX+LID is the right structure - front face, the bottom straight line
# (r10 c12-23), the walls (cols 24-28), the lid flaps (cols 22-28, rows 1-4), and
# the top edge `,-'` at r8 c12-14, which sits level with the cat's arm.
# The TORSO IS THE CAT: rows 5-7 hold the cat's own outline (`,`, `,'-`----Y`, `;`),
# so they are purple - he corrected this explicitly ("the cat belly ... is blue
# right now"). Per-row cut: {1:22, 2:22, 3:22, 4:22, 5:26, 6:26, 7:24, 8:12, 9:14,
# 10:11}. Everything else is the CAT: left silhouette, head, back, torso, inner
# line. Row 11 is the feet band. Refined over five owner corrections on 2026-09-20 -
# treat the owner's feature words ("the lid", "the top edge", "the belly", "the
# arm") as the spec, not the glyphs.
# Colour, owner's call 2026-09-20: a hue gradient, violet -> teal, one stop per
# row (#be95ff family on top settling to #3ddbd9 at the feet). Interpolated in
# OKLab with a LIGHTNESS ramp on top of the hue sweep - the first attempt was
# hue-only at constant L and read as banding, not shading.
# MANDATORY, not cosmetic: a row whose art ends in a backslash must end `\ [/]` -
# one trailing space inside the tag. Rich reads `\[` as an escaped bracket, so
# `...\[/]` prints a literal `[/]` in the CLI (verified: rows 1 and 2 leaked it).
# The trailing space is invisible in both renderers and is what keeps CLI clean.
# Revert = git checkout skins/carbonfox.yaml (per-element map history:
# banner-art/README.md).
banner_hero: |
  [#ab7bf0]  ,-.       _,---._ __  / \ [/]
  [#9e88fd] /  )    .-'       `./ /   \ [/]
  [#9095ff](  (   ,'            `/    /|[/]
  [#80a2ff] \  `-"             \'\   / |[/]
  [#6fafff]  `.              ,  \ \ /  |[/]
  [#5dbbff]   /`.          ,'-`----Y   |[/]
  [#4cc7ff]  (            ;        |   '[/]
  [#3ed1ff]  |  ,-.    ,-'         |  /[/]
  [#3bdbfb]  |  | (   |  $TOKENS   | /[/]
  [#45e3f2]  )  |  \  `.___________|/[/]
  [#57eae8]  `--'   `--'[/]
