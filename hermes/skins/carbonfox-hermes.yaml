name: carbonfox
description: "Eden carbonfox — matches WezTerm + zellij + nvim carbonfox. Palette from EdenEast/nightfox.nvim lua/nightfox/palette/carbonfox.lua."

# Carbonfox palette (EdenEast/nightfox carbonfox.lua):
#   bg #161616  fg #f2f4f8  bg1 #2a2a2a  blue #78a9ff  cyan #33b1ff
#   green #25be6a  purple #be95ff  red #ee5396  orange #3ddbd9
#   dim #dfdfe0  comment #7f8489
colors:
  background: "#161616"              # App/base surface
  banner_border: "#78a9ff"           # Panel border (carbonfox blue)
  banner_title: "#f2f4f8"            # Panel title (carbonfox fg)
  banner_accent: "#78a9ff"           # Section headers (blue)
  banner_dim: "#7f8489"              # Dim/muted text (carbonfox comment)
  banner_text: "#f2f4f8"             # Body text
  ui_accent: "#78a9ff"               # General UI accent (blue)
  ui_label: "#33b1ff"                # UI labels (light-blue)
  ui_ok: "#25be6a"                   # Success (green)
  ui_error: "#ee5396"                # Error (red)
  ui_warn: "#ff9e64"                 # Warning (warm orange)
  ui_tool: "#33b1ff"                 # Tool-call markers (cyan)
  ui_thinking: "#be95ff"             # Reasoning/thinking text (purple)
  diff_added: "#161616"              # Diff added-line background
  diff_removed: "#161616"            # Diff removed-line background
  diff_added_word: "#25be6a"         # Diff added word fg (green)
  diff_removed_word: "#ee5396"       # Diff removed word fg (red)
  syntax_string: "#33b1ff"           # Code strings (cyan)
  syntax_number: "#be95ff"           # Code numbers (purple)
  syntax_keyword: "#78a9ff"          # Code keywords (blue)
  syntax_comment: "#7f8489"          # Code comments (carbonfox comment)
  prompt: "#f2f4f8"                  # Prompt text color
  input_rule: "#78a9ff"              # Input area horizontal rule (blue)
  response_border: "#78a9ff"         # Response box border (blue)
  status_bar_bg: "#161616"           # Status bar background
  status_bar_text: "#dfdfe0"         # Status bar default text
  status_bar_strong: "#f2f4f8"       # Status bar highlighted text
  status_bar_dim: "#7f8489"          # Status bar separators/muted text
  status_bar_good: "#25be6a"         # Healthy context usage (green)
  status_bar_warn: "#ff9e64"         # Warning context usage (orange)
  status_bar_bad: "#ee5396"          # High context usage (red)
  status_bar_critical: "#ff5f5f"     # Critical context usage
  session_label: "#78a9ff"           # Session label color (blue)
  session_border: "#7f8489"          # Session ID dim color
  voice_status_bg: "#161616"         # TUI voice status background
  selection_bg: "#2a2a2a"            # TUI mouse-selection highlight background
  completion_menu_bg: "#161616"      # Completion menu background
  completion_menu_current_bg: "#2a2a2a"   # Active completion row background
  completion_menu_meta_bg: "#161616"       # Completion meta column background
  completion_menu_meta_current_bg: "#2a2a2a"  # Active completion meta background

# Branding — keep agent identity, tune nothing for theme.
branding:
  agent_name: "Hermes Agent"

# banner_hero is a TOP-LEVEL skin key (skin_engine.py:857 reads data["banner_hero"],
# NOT branding.banner_hero). Replaces HERMES_CADUCEUS in CLI + TUI.
# Hero art: "token-cat" (Hayley Jane Wakenshaw / Flump, asciiart.eu 8c5113000921d06a,
# 29x11, artist initials removed). REGION MAP IS OWNER-WORDED - do NOT re-derive it
# from the glyphs (two wrong guesses and two contradictory vision reads on 2026-09-20):
#   "the very bottom straight line is still the box, the cat is also the triangle at
#    the end of the curve as well as the other marks following the curve above the
#    square"
# So: the BOX+LID is the right structure - front face, the bottom straight line
# (r10 c12-23), the walls (cols 24-28), the lid flaps (cols 22-28, rows 1-4), and
# the top edge `,-'` at r8 c12-14, which sits level with the cat's arm.
# The TORSO IS THE CAT: rows 5-7 hold the cat's own outline (`,`, `,'-`----Y`, `;`),
# so they are purple - he corrected this explicitly ("the cat belly ... is blue
# right now"). Per-row cut: {1:22, 2:22, 3:22, 4:22, 5:26, 6:26, 7:24, 8:12, 9:14,
# 10:11}. Everything else is the CAT: left silhouette, head, back, torso, inner
# line. Row 11 is the feet band. Refined over five owner corrections on 2026-09-20 -
# treat the owner's feature words ("the lid", "the top edge", "the belly", "the
# arm") as the spec, not the glyphs.
# Colour, owner's call 2026-09-20: a hue gradient, violet -> teal, one stop per
# row (#be95ff family on top settling to #3ddbd9 at the feet). Interpolated in
# OKLab with a LIGHTNESS ramp on top of the hue sweep - the first attempt was
# hue-only at constant L and read as banding, not shading.
# MANDATORY, not cosmetic: a row whose art ends in a backslash must end `\ [/]` -
# one trailing space inside the tag. Rich reads `\[` as an escaped bracket, so
# `...\[/]` prints a literal `[/]` in the CLI (verified: rows 1 and 2 leaked it).
# The trailing space is invisible in both renderers and is what keeps CLI clean.
# Revert = git checkout skins/carbonfox.yaml (per-element map history:
# banner-art/README.md).
banner_hero: |
  [#ab7bf0]  ,-.       _,---._ __  / \ [/]
  [#9e88fd] /  )    .-'       `./ /   \ [/]
  [#9095ff](  (   ,'            `/    /|[/]
  [#80a2ff] \  `-"             \'\   / |[/]
  [#6fafff]  `.              ,  \ \ /  |[/]
  [#5dbbff]   /`.          ,'-`----Y   |[/]
  [#4cc7ff]  (            ;        |   '[/]
  [#3ed1ff]  |  ,-.    ,-'         |  /[/]
  [#3bdbfb]  |  | (   |  $TOKENS   | /[/]
  [#45e3f2]  )  |  \  `.___________|/[/]
  [#57eae8]  `--'   `--'[/]
